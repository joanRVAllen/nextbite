services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextbite
      POSTGRES_USER: nextbite
      POSTGRES_PASSWORD: nextbite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextbite -d nextbite"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
